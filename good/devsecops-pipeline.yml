name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  devsecops-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install build tools and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit pytest
          python -m pip install -r requirements.txt

      - name: Dependency vulnerability scan
        run: python -m pip_audit -r requirements.txt

      # Modify this step
      - name: Run unit tests
        run: |
          # Change the directory here if your tests are in a different folder or if they don't follow the default naming pattern
          pytest tests/ --cov=App --cov-report=term-missing --cov-report=html --tb=short

      - name: Build container image
        run: docker build -t secure-app-demo .

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.13.1
        with:
          image-ref: secure-app-demo:latest
          format: table
          severity: CRITICAL,HIGH

      - name: Deployment
        run: echo "Deployment successful"
